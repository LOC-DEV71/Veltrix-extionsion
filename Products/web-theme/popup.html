<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veltrix Theme</title>
  <link rel="stylesheet" href="popup.css">
  <style id="popup-fonts"></style>
</head>
<body>
  <div class="container">
    <!-- Đầu popup: thương hiệu + công tắc tổng -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="Logo Veltrix" class="brand-icon">
        <div class="brand-text">
          <div class="brand-title">Veltrix Theme</div>
          <div class="brand-subtitle">Đổi màu &amp; phong cách web</div>
        </div>
      </div>
      <label class="switch" title="Bật / tắt Veltrix Theme">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <main id="controls" class="controls">
      <!-- Lưới thẻ theme -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Bộ giao diện</span>
          <span class="section-hint" id="theme-name">Veltrix Tím</span>
        </div>
        <div id="theme-grid" class="theme-grid" role="radiogroup" aria-label="Chọn bộ giao diện"></div>
      </section>

      <!-- Tuỳ chỉnh phong cách (ghi đè theme) -->
      <section class="section custom-box">
        <div class="section-header">
          <span class="section-title">Tuỳ chỉnh giao diện</span>
          <button type="button" id="reset-all" class="link-btn">Về mặc định của theme</button>
        </div>

        <!-- Font chữ -->
        <div class="field-row">
          <label class="field-label" for="font-select">Font chữ</label>
          <select id="font-select" class="select-input">
            <option value="system">Hệ thống</option>
            <option value="Be Vietnam Pro">Be Vietnam Pro</option>
            <option value="Inter">Inter</option>
            <option value="Nunito">Nunito</option>
          </select>
        </div>

        <!-- Bo góc -->
        <div class="field-row">
          <span class="field-label">Bo góc</span>
          <div class="seg-group" id="radius-group">
            <button type="button" class="seg-btn" data-radius="0">0px</button>
            <button type="button" class="seg-btn" data-radius="8">8px</button>
            <button type="button" class="seg-btn" data-radius="16">16px</button>
          </div>
        </div>

        <!-- Mật độ -->
        <div class="field-row">
          <span class="field-label">Mật độ</span>
          <div class="seg-group" id="density-group">
            <button type="button" class="seg-btn" data-density="compact">Gọn</button>
            <button type="button" class="seg-btn" data-density="normal">Vừa</button>
            <button type="button" class="seg-btn" data-density="comfy">Thoáng</button>
          </div>
        </div>

        <!-- Cỡ chữ -->
        <div class="field-col">
          <div class="field-row">
            <label class="field-label" for="font-scale">Cỡ chữ</label>
            <span class="field-val" id="font-scale-val">100%</span>
          </div>
          <input type="range" id="font-scale" class="range-input" min="0.9" max="1.2" step="0.05" value="1">
        </div>

        <!-- Kính mờ & Rê chuột -->
        <div class="toggle-grid">
          <label class="mini-check">
            <input type="checkbox" id="glass-toggle">
            <span class="site-check"></span>
            <span class="field-label">Kính mờ</span>
          </label>
          <label class="mini-check">
            <input type="checkbox" id="hover-toggle">
            <span class="site-check"></span>
            <span class="field-label">Hiệu ứng rê chuột</span>
          </label>
        </div>

        <!-- Độ mờ nền (Blur) -->
        <div class="field-col">
          <div class="field-row">
            <label class="field-label" for="blur-range">Độ mờ (Blur)</label>
            <span class="field-val" id="blur-val">16px</span>
          </div>
          <input type="range" id="blur-range" class="range-input" min="0" max="32" step="2" value="16">
        </div>

        <!-- Hình nền -->
        <div class="field-col">
          <div class="field-row">
            <span class="field-label">Hình nền</span>
            <span class="field-val" id="bg-state">Theo theme</span>
          </div>
          <div class="bg-actions">
            <label class="file-btn">
              <input type="file" id="bg-file" accept="image/*" hidden>
              <span>Chọn ảnh nền…</span>
            </label>
            <button type="button" id="bg-clear" class="mini-btn" title="Tắt hình nền">Tắt nền</button>
          </div>
        </div>
      </section>

      <!-- Màu nhấn tuỳ chọn -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Màu nhấn tuỳ chọn</span>
          <code class="color-code" id="accent-code">#a78bfa</code>
        </div>
        <div class="accent-row">
          <label class="color-picker-wrap" title="Chọn màu nhấn">
            <input type="color" id="accent" value="#a78bfa">
            <span class="color-swatch" id="accent-swatch"></span>
            <span class="color-label">Chọn màu</span>
          </label>
          <button type="button" id="reset-accent" class="reset-btn">Dùng màu của theme</button>
        </div>
      </section>

      <!-- Áp dụng cho từng trang -->
      <section class="section">
        <div class="section-header">
          <span class="section-title">Áp dụng cho</span>
        </div>
        <div class="sites-list">
          <label class="site-item">
            <input type="checkbox" data-site="youtube" checked>
            <span class="site-check"></span>
            <span class="site-name">YouTube</span>
          </label>
          <label class="site-item">
            <input type="checkbox" data-site="facebook" checked>
            <span class="site-check"></span>
            <span class="site-name">Facebook</span>
          </label>
          <label class="site-item">
            <input type="checkbox" data-site="google" checked>
            <span class="site-check"></span>
            <span class="site-name">Google</span>
          </label>
        </div>
      </section>
    </main>

    <!-- Chân popup -->
    <footer class="footer">
      <span class="status-dot" id="status-dot"></span>
      <span class="footer-text" id="status-text">Đang bật •</span>
      <a id="veltrix-store" class="footer-link" href="https://extension.veltrixhost.cloud" target="_blank" rel="noopener" title="extension.veltrixhost.cloud">Veltrix Store</a>
    </footer>
  </div>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
